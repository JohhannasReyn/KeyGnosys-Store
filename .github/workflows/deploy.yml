name: Deploy
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    # Production deploys stay off until the owner sets the repo variable PRODUCTION_DEPLOY_ENABLED=true,
    # and only ever run from main (a manual dispatch on another branch is skipped).
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Guard - production never uses test overrides
        run: test -z "${KG_SITE_OVERRIDES:-}"
      - name: Build from live release data (fails closed; previous deploy stays live)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Scan the live build for third-party resources
        run: npm run check:static
      - name: Name only platforms the release manifest ships
        run: npm run check:platforms
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production headers (apex and www)
        if: vars.SITE_URL != ''
        run: npx tsx scripts/check-headers.ts "${{ vars.SITE_URL }}" "${{ vars.SITE_WWW_URL }}"
